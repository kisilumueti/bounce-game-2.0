name: Quality and Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile C and C++
        run: cmake --build build --parallel
      - name: Run regression tests
        run: ctest --test-dir build --output-on-failure
      - name: Run native engine
        run: ./build/bounce_cli
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --check game.js
      - run: python -m py_compile tools/score_audit.py
  webassembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - run: emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - run: cmake --build build-wasm --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: neon-bounce-webassembly
          path: |
            build-wasm/bounce-core.js
            build-wasm/bounce-core.wasm